{% extends 'index.html' %}

{% block nav %}
<div class="flex justify-end items-center gap-[5px]">
    <a href="{% url 'profile' %}">
        <img src="https://i.pinimg.com/736x/19/e6/6e/19e66e7b54a1a06baea79eb1bb7cd725.jpg" alt=""
            class="rounded-[50%] w-[50px] h-[50px] cursor-pointer">
    </a>
    <p>{{ username }}</p>
</div>
{% endblock %}

{% block content %}
<section class="h-[80vh] w-full flex items-center justify-between flex-col pb-5">
    {% if tasks %}
    <ul class="flex items-start flex-col w-full gap-[15px] h-[55vh] overflow-y-auto"
        style="scrollbar-width: none; -ms-overflow-style: none;">
        {% for item in tasks %}
        <li
            class="{% if item.completed_time %} border border-green-800 text-green-500 rounded-lg hover:bg-green-500 hover:text-black  {% else %} border border-blue-800 text-blue-500 rounded-lg hover:bg-blue-700 hover:text-black {% endif %} duration-200 px-10 py-4 w-full hover:translate-y-[3px] cursor-pointer flex items-center justify-between gap-[10px]">
            <p>
                {{item.tasks}}
            </p>
            <div
                class="flex items-center gap-[10px] group {% if item.completed_time %} text-green-700 {% else %} text-blue-900 {% endif %} duration-200 cursor-pointer justify-between gap-[15px]">
                <a href="/tasks/return_from_delete/{{ item.id }}">
                    <i class="fa-solid fa-arrow-left text-xl duration-100 hover:text-orange-800"></i>
                </a>
                <a href="/tasks/delete_from_delete/{{ item.id }}">
                    <i class="fa-solid fa-trash text-xl duration-100 hover:text-red-700"></i>
                </a>
            </div>
        </li>
        {% endfor %}
    </ul>
    <a href="/tasks/delete_all">
        <button class="text-red-400 px-3 py-2 rounded duration-100 hover:bg-red-400 hover:text-black">Delete
            all</button>
    </a>
    {% else %}
    <div class="w-full h-[60vh] flex items-center justify-center flex-col gap-[15px]">
        <h2 class="text-white text-5xl">You have no deleted tasks</h2>
        <h4 class="text-green-300"> Add a task now</h4>
    </div>
    {% endif %}
</section>
{% endblock %}

{% extends 'index.html' %}

{% block content %}

<section class="h-[80vh] w-full flex items-center justify-center flex-col gap-[15px]">
    <h2 class="text-white text-5xl">Add <span class="text-green-400">New</span> Category</h2>
    <form class="w-full max-w-[500px] flex items-start gap-[5px]" method="POST">
        {% csrf_token %}
        <div class="flex flex-col items-start gap-[5px] w-full">
            <input type="text" placeholder="New Category..."
                class="px-6 py-3 rounded border-green-500 border bg-black outline-green-300 text-white w-full"
                name="category_name" required>
            <p class="text-white">
                {{message}}
            </p>
        </div>
        <button type="submit"
            class="text-white bg-green-500 px-5 py-3 rounded duration-100 hover:bg-green-700">Add</button>
    </form>
</section>
{% endblock %}
